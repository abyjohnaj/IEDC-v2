name: CI & Preview Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://quxwzqcbuksxxgpprztw.supabase.co' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1eHd6cWNidWtzeHhncHByenR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MDY4NDUsImV4cCI6MjEwNDk4Mjg0NX0.P_NWWDiY8yWgmYpSq2ExWhjNad872EwsZGo7td20DLs' }}
  VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN || '' }}

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Lint, Typecheck, Vitest Unit Tests & RLS Matrix Assertions
  # ----------------------------------------------------------------------------
  lint-and-test:
    name: Lint, Typecheck & Vitest + RLS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Run Role-Level Security (RLS) Matrix Tests
        run: npm run test:rls

  # ----------------------------------------------------------------------------
  # Job 2: Supabase Migration Check (db lint & apply migrations on fresh DB)
  # ----------------------------------------------------------------------------
  supabase-migrations:
    name: Supabase Migration Verification & DB Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Ephemeral Local Supabase
        run: |
          supabase init --workdir . || true
          supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector

      - name: Run Supabase DB Lint
        run: |
          supabase db lint --level error

      - name: Verify Migrations Apply on Clean Database
        run: |
          supabase db reset

      - name: Run pgTAP RLS Tests
        run: |
          supabase test db || true

      - name: Stop Supabase Container
        if: always()
        run: |
          supabase stop

  # ----------------------------------------------------------------------------
  # Job 3: Playwright End-to-End Tests
  # ----------------------------------------------------------------------------
  playwright-e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium & OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 4: Preview Deployment Per Pull Request
  # ----------------------------------------------------------------------------
  preview-deploy:
    name: Preview Deploy (PR Channel)
    if: github.event_name == 'pull_request'
    needs: [lint-and-test, supabase-migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle with Sourcemaps
        run: npm run build

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_FIREBASE_SECRET == 'true'
        env:
          HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IEDCWEBSITE != '' }}
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IEDCWEBSITE }}'
          projectId: iedcwebsite
          channelId: 'pr-${{ github.event.number }}'
          expires: 7d

      - name: Fallback Preview Build Artifact
        if: env.HAS_FIREBASE_SECRET != 'true'
        env:
          HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IEDCWEBSITE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-pr-${{ github.event.number }}
          path: dist/
          retention-days: 7
